# include/card3d.h from src/lib.rs: `cbindgen --config cbindgen.toml --output include/card3d.h`
# (apple/build-xcframework.sh runs it and fails when the committed header is out of date).
language = "C"
include_guard = "CARD3D_H"
cpp_compat = true
usize_is_size_t = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
header = """/*
 * card3d: the card engine's C ABI (crates/card3d-ffi). Generated by cbindgen from src/lib.rs; don't edit.
 *
 * Ownership and threading:
 * - Strings in: NUL-terminated UTF-8, borrowed for the call.
 * - Strings out (`char **` parameters): allocated by the library, freed by the caller with
 *   card3d_string_free(). A NULL out-pointer means the caller doesn't want it. On failure, `error`
 *   receives a message (free it too); other out-strings stay NULL.
 * - Byte buffers out (Card3dBytes): freed with card3d_bytes_free().
 * - A Card3dStage is made by card3d_stage_new(), freed by card3d_stage_free(), and used only on the
 *   thread that made it (the main thread on Apple platforms). It must not outlive its CAMetalLayer;
 *   it holds its own reference to an ANativeWindow (Android).
 * - After CARD3D_STATUS_GPU or CARD3D_STATUS_PANIC a stage refuses further work: free it and make a
 *   new one. Engine panics never cross this boundary.
 * - Times are milliseconds on a monotonic clock; pointer positions are points from the view's top left.
 */"""

[export]
include = ["Card3dStatus", "Card3dSurfaceKind"]
# src/android.rs's imports from the NDK (its JNI methods are `extern "system"`, which cbindgen skips).
exclude = ["ANativeWindow_fromSurface", "ANativeWindow_acquire", "ANativeWindow_release", "__android_log_write"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[const]
allow_static_const = false

[defines]
