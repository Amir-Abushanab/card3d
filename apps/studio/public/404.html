<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Card Studio</title>
    <meta name="theme-color" content="#09090e" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #09090e;
        color: #ddd;
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 60ch;
        padding: 0 24px;
      }
      a {
        color: #fff;
      }
    </style>

  <body>
    <!-- Cloudflare Pages answers a path that doesn't exist with this page and a 404 (without it, every path would get the studio with a 200). -->

      <h1>Page not found</h1>
      <p>There's nothing at this address. <a href="/">Open Card Studio</a> or see the <a href="/showcase">showcase</a>.</p>
    </main>
  </body>
