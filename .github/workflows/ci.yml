# CI: the Rust engine, its two web builds, the TypeScript packages and Studio, the e2e suite, the web
# builds on WebGPU without a GPU (SwiftShader), and the studio deploy on pushes to main.
#
#   rust ──────────────────────────────────────┐
#   web (wasm builds → artifact engine-wasm) ─┬─ typescript ─┤
#                                              ├─ e2e ────────┼─ deploy-preflight ─ deploy-studio (main only)
#                                              └─ webgpu
#   changeset (pull requests: warns when a package changed without a changeset)
#
# The Swift package and the Android library build in native.yml; the agent skills' Intent checks in
# check-skills.yml; versioning and npm publishing in version.yml and release.yml (which runs after this
# workflow passes on main and reuses its engine-wasm artifact). The README's "Contributing" section
# has the same commands for running locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it supersedes; runs on main finish (the deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The toolchain the size budgets and lints are set against: bump on purpose (also native.yml).
  RUST_TOOLCHAIN: "1.100.0"
  NODE_VERSION: "26"
  CARGO_TERM_COLOR: always

jobs:
  # scripts/check-rust.sh --online (rustfmt, taplo, typos, crate layering, cargo-shear, cargo-deny with the
  # RustSec advisories, clippy over the workspace and the engine's features one by one; the wasm builds'
  # clippy is the web job's), the workspace's tests (the GPU test on lavapipe, Mesa's software Vulkan) and
  # the Rust design validator held to the TypeScript one.
  rust:
    name: Rust (fmt, deny, clippy, tests, validator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # scripts/check-rust.sh's tools, at the versions it names.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.21.0,cargo-shear@1.14.1,cargo-hack@0.6.46,taplo@0.10.0,typos@1.52.2
      # Node runs the validator's TypeScript side straight from packages/core/src (no install needed), and
      # check-rust.sh's layering check.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # lavapipe: a Vulkan adapter without a GPU, so card3d-ffi's offscreen-stage test renders instead of
      # skipping (CARD3D_REQUIRE_GPU below makes a missing adapter a failure).
      - name: Install a software Vulkan driver (lavapipe)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      # Every target's crates (the licence check and the notices cover the Apple and Android builds too).
      - run: cargo fetch --locked
      # Formatting, spelling, layering, unused dependencies, deny.toml (licences, bans, sources, RustSec
      # advisories: --online fetches the database) and lints (`pnpm check:rust` runs the same offline).
      - run: scripts/check-rust.sh --online
      - run: cargo test --workspace --locked
        env:
          CARD3D_REQUIRE_GPU: "1"
      - name: Validator catalog is current
        run: node crates/card3d-tools/validate-catalog.ts --check
      - name: Rust validator matches the TypeScript one (fixtures, presets, 4000 mutated designs)
        run: node crates/card3d-tools/validate-compare.ts --count 4000

  # Both web builds (WebGPU and the WebGL 2 fallback): lints for wasm32, then build-web.sh, which splits,
  # optimises and fingerprints them and fails over the size budgets. The output is gitignored, so every
  # job that needs it downloads the engine-wasm artifact.
  web:
    name: Web builds (wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # wasm-split-cli has its own cache below.
          cache-bin: "false"
      # build-web.sh's tools, at the versions it names.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.130
      - name: Cache wasm-split-cli
        id: wasm-split
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-split-cli
          key: wasm-split-cli-0.2.5-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}
      - name: Install wasm-split-cli
        if: steps.wasm-split.outputs.cache-hit != 'true'
        run: cargo install wasm_split_cli_support --version 0.2.5 --features build-binary --locked
      - name: Install binaryen (wasm-opt)
        env:
          BINARYEN: version_133
          SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          wasm-bindgen --version
          wasm-split-cli --help >/dev/null && echo "wasm-split-cli 0.2.5"
          wasm-opt --version
          command -v brotli >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends brotli; }
          brotli --version
      - run: cargo clippy -p card3d-web --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy -p card3d-web --target wasm32-unknown-unknown --locked --no-default-features --features webgl -- -D warnings
      - run: crates/card3d-web/build-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wasm
          path: |
            packages/core/wasm/pkg
            packages/core/wasm/pkg-webgl
          if-no-files-found: error
          retention-days: 14

  # Formatting (oxfmt), lints (oxlint), typecheck, unused files / exports / dependencies (knip), the
  # module boundaries (dependency-cruiser), the Rust crates' notices (pnpm check:notices, which reads the
  # crates' licence files from Cargo's registry: hence Rust and `cargo fetch`), the agent skills the
  # packages ship (pnpm check:skills: generated references current, `intent validate`, offline), unit
  # tests, builds and what each @card3d package would publish (skills included). The tools come from the
  # lockfile.
  typescript:
    name: TypeScript (check, build, pack)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-wasm
          path: packages/core/wasm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The registry only (nothing is compiled here).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "false"
      - run: cargo fetch --locked
      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # format:check + lint + typecheck + knip + depcruise + check:notices + check:skills + unit tests
      - run: pnpm check
      - run: pnpm build
      # What `pnpm publish` would ship for each @card3d package (scripts/check-pack.mjs); publishes nothing.
      - run: pnpm pack:check

  # The built studio and showcase, and <metal-card> from the built CDN bundle (apps/embed-example), in
  # headless Chromium with WebGL on SwiftShader (apps/studio/playwright.config.ts).
  e2e:
    name: E2E (Studio, Playwright)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-wasm
          path: packages/core/wasm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/studio/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/studio
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/studio
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/studio/e2e/.results
          retention-days: 7
          if-no-files-found: ignore

  # The e2e suite has no WebGPU adapter, so it only exercises the WebGL build. Here both web builds run in headless Chromium with WebGPU on SwiftShader
  # (CARD3D_SWIFTSHADER, crates/card3d-tools/web-chrome.mjs): the loader's WebGPU → WebGL fallbacks, and the
  # comparison harness in its fresh-clone mode (no three.js archive: each web build against the engine's
  # native render, here on lavapipe) over designs that cover the main paths, all within the bar on
  # SwiftShader + lavapipe (checked in a Linux container). Left out: designs whose high-frequency faces
  # differ on software rasterisers (face-halftone-*, holo-styles, face-caustics-base, addon-vines: coarse
  # vs fine derivatives, filtering, sin precision, edge coverage). The lens faces and the liquid-metal fill
  # are here as the regression checks for two portability bugs these runners found (pow of a negative
  # base, NaN on lavapipe; smoothstep with equal edges, flipped on SwiftShader).
  # Add a design here once it passes on both.
  webgpu:
    name: WebGPU + WebGL on SwiftShader (fallbacks, harness subset)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARD3D_SWIFTSHADER: "1"
      # The harness's native renders build card3d-tools in release; skip fat LTO here to build faster.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # Substrings of the design files' names (compare.mjs --only), so each also picks up any
      # scene-<name> variant.
      DESIGNS: brushed-silver.json,holo-front.json,body-shape-notch.json,body-edge-chamfer.json,glass-clear.json,glass-print.json,stickers.json,sticker-gif.json,artwork-printed.json,face-foil-flakes-skin.json,addon-vines.json,addon-shine-glass.json,face-liquid-metal-mark.json,scene-floor.json,addon-shine.json,face-lens.json,face-lens-skin.json,face-liquid-metal-fill.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-wasm
          path: packages/core/wasm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install a software Vulkan driver (lavapipe) for the native renders
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./crates/card3d-tools/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: crates/card3d-tools
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: crates/card3d-tools
        run: pnpm exec playwright install-deps chromium
      - name: Build the native renderer
        run: cargo build --release --locked -p card3d-tools --bin render --bin compare
      - name: Loader fallbacks (WebGPU start, device loss → WebGL, crash recovery, chunk retries)
        run: node crates/card3d-web/web/fallback.test.mjs
      - name: Comparison harness, fresh-clone mode (WebGPU and WebGL builds vs the native render)
        run: node crates/card3d-tools/compare.mjs --web --webgl --only "$DESIGNS"
      - name: Upload the harness's renders and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-out
          path: |
            crates/card3d-tools/out
            !crates/card3d-tools/out/designs
          retention-days: 7
          if-no-files-found: ignore

  # Pull requests only: a warning when a published @card3d package changed with no changeset in the PR
  # (`changeset status --since` the base). Never fails: docs, tests and refactors need no release, and
  # `pnpm changeset --empty` records that on purpose. Private workspace packages (apps, tools) don't count.
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changeset status diffs against the base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Changeset status
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! pnpm exec changeset status --verbose --since="origin/$BASE_REF"; then
            echo "::warning title=No changeset::A published @card3d package changed without a changeset. Add one with \`pnpm changeset\` (or \`pnpm changeset --empty\` when the change needs no release)."
          fi

  # Deploy only when the Cloudflare secrets exist, so a repository without them (see DEPLOY.md) still
  # runs green instead of failing on a missing token.
  deploy-preflight:
    name: Deploy preflight
    # The webgpu job is new: add it here once it has proven stable on GitHub's runners.
    needs: [rust, typescript, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping the studio deploy. See DEPLOY.md."
          fi

  deploy-studio:
    name: Deploy studio + showcase → Cloudflare Pages
    needs: deploy-preflight
    if: needs.deploy-preflight.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One deploy at a time; a newer one waits rather than cancelling one in flight.
    concurrency:
      group: deploy-studio
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The engine's web builds (the web job), which the studio loads from @card3d/core's wasm/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-wasm
          path: packages/core/wasm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The studio is a multi-page build: the studio at "/" and the showcase at "/showcase.html".
      - run: pnpm --filter card-studio build
      # cloudflare/wrangler-action auto-installs wrangler via `pnpm add`, which pnpm refuses at a
      # workspace root (ERR_PNPM_ADDING_TO_ROOT). Invoke wrangler directly instead — `pnpm dlx` runs
      # it from a temp store without touching the workspace, and wrangler reads the CLOUDFLARE_* env.
      - name: Deploy to Cloudflare Pages
        run: |
          # wrangler doesn't auto-create the Pages project — create it once (no-op once it exists).
          pnpm dlx wrangler pages project create card-studio --production-branch=main || true
          pnpm dlx wrangler pages deploy apps/studio/dist --project-name=card-studio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
